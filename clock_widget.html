  #vignette {
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(8,6,18,0.2) 0%, rgba(8,6,18,0.5) 50%, rgba(8,6,18,0.85) 100%);
  }
  #clock-face {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
  }
  #time-display {
    font-size: 76px;
    font-weight: 200;
    color: #fff;
    letter-spacing: 6px;
    line-height: 1;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 60px rgba(130,100,220,0.6), 0 2px 20px rgba(0,0,0,0.8);
  }
  #divider {
    width: 50px;
    height: 1px;
    background: rgba(180,150,255,0.5);
    margin: 14px auto;
  }
  #date-display {
    font-size: 13px;
    color: rgba(210,190,255,0.85);
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 1px 10px rgba(0,0,0,0.8);
    font-weight: 300;
  }
  #controls {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.6rem 1rem;
    border-top: 1px solid rgba(255,255,255,0.08);
    width: 100%;
    justify-content: center;
  }
  .ctrl-label { font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 2px; text-transform: uppercase; }
  input[type=range] { width: 100px; accent-color: rgba(170,140,255,0.9); }
</style>
</head>
<body>
<div id="widget">
  <div id="bg"></div>
  <div id="vignette"></div>
  <div id="clock-face">
    <div id="time-display">00:00:00</div>
    <div id="divider"></div>
    <div id="date-display">Loading...</div>
  </div>
  <div id="controls">
    <span class="ctrl-label">Overlay</span>
    <input type="range" id="slider" min="0" max="90" value="55" step="1" />
  </div>
</div>
<script>
const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function tick() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('time-display').textContent = h+':'+m+':'+s;
  document.getElementById('date-display').textContent =
    days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
}
tick(); setInterval(tick, 1000);
document.getElementById('slider').addEventListener('input', function() {
  const v = parseInt(this.value)/100;
  document.getElementById('vignette').style.background =
    'linear-gradient(to bottom, rgba(8,6,18,'+v*0.4+') 0%, rgba(8,6,18,'+v*0.9+') 50%, rgba(8,6,18,'+v+') 100%)';
});
</script>
</body>
</html>
